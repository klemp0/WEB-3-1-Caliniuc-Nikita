<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Gestionarea elevilor</title>
</head>
<body>
    <main class="container my-4">
        <h1 class="mb-4">Catalog Electronic</h1>
        <form id="formElev" class="card card-body mb-3" novalidate>
            <div class="row g-3">
            <div class="col-12 col-md-6">
            <label for="nume" class="form-label">Nume si Prenume</label>
            <input type="text" id="nume" class="form-control">
            </div>
            <div class="col-6 col-md-2">
            <label for="varsta" class="form-label">Varsta</label>
            <input type="number" id="varsta" class="form-control">
            </div>
            <div class="col-6 col-md-4">
            <label for="grupa" class="form-label">Grupa</label>
            <input type="text" id="grupa" class="form-control">
            </div>
            <div class="col-12">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control">
            </div>
            <div class="col-12">
            <div id="eroare" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary">Adauga Elev</button>
            </div>
            </div>
        </form>
        <p>Total Elevi: <span id="contor" class="badge bg-secondary">0</span></p>
        <section id="lista" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></section>
    </main>
    <script src="script.js"></script>
</body>
</html>
