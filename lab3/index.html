<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lab 3</title>
</head>
<body>
    <button id="rock-btn">Piatra</button>
    <button id="scissor-btn">Foarfeca</button>
    <button id="paper-btn">Hartie</button>

    <p>Score: <br>
        Player: <span id="player-score">0</span><br>
        Computer: <span id="comp-score">0</span><br>
        Egalitati: <span id="draw">0</span>
    </p>

    <button id="new-game">New game</button>
    <p>Runde: <span id="total-rounds">0</span></p>
    <p>Conduce: <span id="winning">-</span></p>

    <p>Alegerea ta: <span id="player-choice">-</span></p>
    <p>Alegerea calculatorului: <span id="comp-choice">-</span></p>

    <p>Rezultat: <span id="rezultat">-</span></p>

    <p>A castigat: <span id="winner">-</span></p>
    
    <script src="script.js"></script>
</body>
</html>
